seed: 42
prepare:
  test_size: 0.2
train:
  model: random_forest          # random_forest | gradient_boosting | ridge
  random_forest:
    n_estimators: 400
    max_depth: null
    min_samples_leaf: 1
    max_features: 0.5
  gradient_boosting:
    learning_rate: 0.05
    max_iter: 500
    max_leaf_nodes: 31
  ridge:
    alpha: 1.0
mlflow:
  experiment: wine-quality
  registered_model: wine-quality-regressor
