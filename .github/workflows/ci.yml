name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[train,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Reproduce pipeline (prepare -> train -> evaluate)
        run: dvc repro
      - name: Show metrics
        run: dvc metrics show
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/model.joblib
            reports/metrics.json

  image:
    needs: test-and-train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-and-metrics
      - name: Build image
        run: docker build -t wine-quality-api:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 wine-quality-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8000/readyz && break; sleep 1; done
          curl -fsS -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"samples":[{"fixed acidity":7.4,"volatile acidity":0.7,"citric acid":0,"residual sugar":1.9,"chlorides":0.076,"free sulfur dioxide":11,"total sulfur dioxide":34,"density":0.9978,"pH":3.51,"sulphates":0.56,"alcohol":9.4,"is_red":true}]}'
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wine-quality-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag wine-quality-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag wine-quality-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/wine-quality-api
      - run: helm template demo deploy/helm/wine-quality-api > /tmp/rendered.yaml
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/rendered.yaml
